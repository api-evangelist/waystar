    No public SLA or uptime target. Waystar publishes Support Terms
    (https://www.waystar.com/support-terms/) and Master Product Terms
    (https://www.waystar.com/master-product-terms/) as contract documents, but
    neither states a numeric availability commitment on the public page.
  contract_documents:
