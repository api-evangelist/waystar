availability_notes:
  payer_dependency: >-
    Effective availability of every real-time transaction is bounded by the
    downstream PAYER, not by Waystar. Payer maintenance windows and payer-side
    timeouts surface as "Failed at Payer" / payer timeout conditions. This is the
    dominant operational reality of a clearinghouse API and is not covered by any
    Waystar-side status signal.
  batch_windows: >-
    277U claim status response files are written to the SFTP download directory
    at midnight Eastern on each day the account had claim activity.
