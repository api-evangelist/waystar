description: >-
  FinOps view of Waystar spend. Waystar is an enterprise healthcare RCM and
  clearinghouse platform billed through negotiated contracts rather than
  public, usage-metered API pricing. Cost typically combines a platform
  subscription with per-transaction clearinghouse fees on volume - eligibility
  checks (270/271), claims submitted (837), claim status (276/277),
  remittances/ERAs (835), and authorizations (278). Because pricing is
  quote-based, the meters below are modeled to help a customer allocate and
  forecast RCM spend, not derived from a published rate card.
notes: >-
  Per-unit rates are not public; reconcile against your Waystar contract and
  invoices. Effective cost per transaction depends on negotiated volume tiers,
  which modules are licensed, and payer mix.
