meters:
- name: eligibility_transactions
  description: Eligibility/benefit inquiries (X12 270/271) processed through the clearinghouse.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - payer
  - provider
- name: claim_transactions
  description: Claims submitted (X12 837P/I/D) through the clearinghouse.
  unit: claims
  aggregation: sum
  dimensions:
  - account
  - payer
  - claim_type
- name: claim_status_transactions
  description: Claim status inquiries (X12 276/277).
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - payer
- name: remittance_transactions
  description: Remittance advice / ERA (X12 835) retrieved and posted.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - payer
- name: authorization_transactions
  description: Prior authorization / referral reviews (X12 278) plus RPA-assisted authorizations.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - payer
- name: platform_subscription
  description: Recurring platform/module subscription independent of transaction volume.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - module
principles:
- name: Visibility
  description: Track transaction counts by type (eligibility, claims, status, remits, auth) and by payer to see where clearinghouse fees accrue.
- name: Allocation
  description: Map transactions to provider/practice/team so RCM spend maps to internal cost centers and lines of business.
- name: Optimization
  description: Reduce avoidable transactions - cut denials and rework, batch where real-time is not required, and consolidate eligibility checks - to lower per-transaction spend.
- name: Accountability
  description: Assign owners per module and review monthly transaction volume and fees against the contracted tiers.
