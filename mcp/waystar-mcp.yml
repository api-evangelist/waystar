agent_surface_assessment:
  summary: >-
    Waystar has no agent surface today. The obstacle is upstream of MCP - there
    is no public machine-readable contract to project into tools, the
    authentication model is six different hand-rolled schemes dominated by HMAC
    canonicalization (authentication/waystar-authentication.yml), and the two
    newest REST surfaces are submit-then-poll rather than synchronous
    (conventions/waystar-conventions.yml). Any agent integration today is bespoke
    code written by a contracted partner.
