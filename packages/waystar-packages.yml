provider: Waystar
providerId: waystar
description: >-
  Waystar publishes NO first-party client libraries. Every public package
  registry was queried by name and none returns a Waystar-authored SDK; the
  Waystar developer portal has no SDK, download or code-sample section in its
  navigation; and Waystar's own GitHub organization contains two forked vendor
  example repositories and no client library. Integration is done by hand against
  form-POST, SOAP and JSON endpoints with a client-computed HMAC signature - the
  signature canonicalization documented in
  authentication/waystar-authentication.yml is exactly the kind of work an SDK
  normally removes, and every Waystar integrator writes it themselves.
