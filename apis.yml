apis:
- aid: waystar:waystar-eligibility-verification-api
  name: Waystar Eligibility Verification API
  tags:
  - Eligibility
  - Benefits
  - X12 270/271
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.waystar.com/our-platform/financial-clearance/eligibility-verification/
  properties:
  - url: https://developer.waystar.com/
    type: Documentation
  - url: https://www.waystar.com/our-platform/financial-clearance/eligibility-verification/
    type: SignUp
  description: Real-time and batch insurance eligibility and benefits verification,
    exchanging X12 270 inquiries and 271 responses to confirm coverage, plan
    details, copays, deductibles, and service-type benefits before a visit.
    Endpoints are modeled from Waystar's Eligibility product and the 270/271
    transaction set; concrete paths are provisioned through the partner program.
- aid: waystar:waystar-prior-authorization-api
  name: Waystar Authorization & Referral API
  tags:
  - Prior Authorization
  - Referrals
  - X12 278
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.waystar.com/our-platform/financial-clearance/authorizations/
  properties:
  - url: https://developer.waystar.com/
    type: Documentation
  - url: https://www.waystar.com/our-platform/financial-clearance/authorization-referral-status/
    type: Documentation
  description: Automates prior authorization and referral determination and status,
    modeled on the X12 278 health care services review request/response. Covers
    submitting authorization requests, checking auth/referral status, and returning
    determinations. Waystar layers RPA and payer-portal automation on top of EDI
    where payers lack a transaction. Modeled from public product docs.
- aid: waystar:waystar-patient-estimation-api
  name: Waystar Patient Estimation API
  tags:
  - Patient Estimation
  - Price Transparency
  - Financial Clearance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.waystar.com/our-platform/financial-clearance/coverage-detection/
  properties:
  - url: https://developer.waystar.com/
    type: Documentation
  description: Produces pre-service, good-faith patient cost estimates by combining
    eligibility/benefit data, contracted rates, and procedure codes to support price
    transparency and up-front patient collections. Modeled from Waystar's financial
    clearance product; not backed by a published OpenAPI definition.
- aid: waystar:waystar-claim-management-api
  name: Waystar Claim Management API
  tags:
  - Claims
  - Claim Submission
  - X12 837
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.waystar.com/our-platform/claim-management/claim-manager/
  properties:
  - url: https://developer.waystar.com/
    type: Documentation
  - url: https://www.waystar.com/our-platform/claim-management/claim-manager/
    type: Documentation
  description: Submits, scrubs, edits, tracks, and manages professional,
    institutional, and dental claims through Waystar's clearinghouse, modeled on the
    X12 837P/837I/837D claim transaction set. Includes claim creation, validation
    against payer edits, submission, and lifecycle management. Endpoints are modeled
    from the Claim Manager product and 837 standard.
- aid: waystar:waystar-claim-status-api
  name: Waystar Claim Status API
  tags:
  - Claim Status
  - X12 276/277
  - Tracking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.waystar.com/our-platform/claim-management/claim-monitoring/
  properties:
  - url: https://developer.waystar.com/
    type: Documentation
  description: Queries and monitors claim status across payers, modeled on the X12
    276 status inquiry and 277 status response - returning received, accepted,
    pending, denied, and paid states. Supports both real-time inquiry and automated
    status monitoring. Modeled from Waystar's claim monitoring product.
- aid: waystar:waystar-remittance-era-api
  name: Waystar Remittance & ERA API
  tags:
  - Remittance
  - ERA
  - X12 835
  - Payment Posting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.waystar.com/our-platform/payment-management/remit-manager/
  properties:
  - url: https://developer.waystar.com/
    type: Documentation
  description: Retrieves electronic remittance advice (835/ERA), payments, and
    adjustments for automated payment posting and reconciliation, with raw X12 835
    artifacts and parsed JSON. Modeled on the X12 835 transaction and Waystar's
    Remit Manager product; concrete endpoints are partner-provisioned.
- aid: waystar:waystar-denial-management-api
  name: Waystar Denial & Appeal Management API
  tags:
  - Denials
  - Appeals
  - Recovery
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.waystar.com/our-platform/denial-prevention-recovery/denial-recovery/
  properties:
  - url: https://developer.waystar.com/
    type: Documentation
  description: Identifies denied claims, exposes denial and remark codes and
    explanation-of-benefits detail, and supports appeal creation, packaging, and
    resubmission workflows. Modeled from Waystar's denial prevention and recovery
    product; not backed by a published OpenAPI definition.
