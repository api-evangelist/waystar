name: Waystar
kind: company
description: Waystar is a healthcare payments and revenue cycle management (RCM)
  software company that operates a national clearinghouse connecting providers to
  payers. Its cloud platform spans financial clearance (eligibility, prior
  authorization, patient estimation), claim management, payment and remittance
  management, and denial prevention and recovery. Waystar exposes integration
  through REST APIs, web services, HL7, sFTP/batch, RPA, and X12 EDI transactions
  (270/271 eligibility, 276/277 claim status, 837 claims, 835 remittance/ERA, 278
  authorization). API access is delivered through a partner/developer program at
  developer.waystar.com; the portal renders its full documentation navigation to
  anyone but serves a login form in place of every document body, and sandbox
  accounts are provisioned by email rather than self-service. Waystar publishes no
  OpenAPI, no llms.txt, no MCP server, no agent card and no client SDK in any
  package registry. Authentication is six hand-rolled schemes rather than one -
  HMAC-SHA1 body signatures on the classic Developer Suite, HMAC-SHA256
  Authorization headers on Patient Estimation, credentials in the POST body on the
  eligibility gateway, HTTP Basic, WS-Security UsernameToken inside CAQH CORE SOAP
  envelopes, and X.509 client certificates - with no OAuth 2.0 and no OpenID
  Connect anywhere. The API surface below is documented from Waystar's public
  product pages, its developer-portal structure and the underlying X12 standards
  rather than from a published machine-readable definition.
