  certifications: [HIPAA, PCI DSS, SSAE 16, EHNAC, GLBA]
  access_note: >-
    CORRECTED 2026-08-15. The page carrying these certification claims is behind
    the developer-portal login. Re-fetched anonymously on 2026-08-15 it returns
    101KB of navigation and a login form and contains none of the strings HIPAA,
    PCI, SSAE, EHNAC or Gramm - the document body is not served to an
    unauthenticated reader. The only compliance statement Waystar publishes on a
    genuinely public page is the word HIPAA inside its privacy policy and master
    product terms, plus the responsible-disclosure line about protecting data
    "above and beyond compliance with HIPAA and PCI regulations". That is a
    passing mention, not a published compliance program.
  trust_center: false
  trust_center_note: >-
    No trust.waystar.com (no TLS/no response) and no dedicated trust or
    compliance page (https://www.waystar.com/compliance/ 404). There are no
    downloadable attestation reports and no certification registry.
    https://www.waystar.com/security/ resolves but names no certification at all -
    it carries a marketing video titled "Security spotlight: A software platform
    designed for trust". No TrustCenter pointer is emitted.
  pointer_decision: >-
    No type Compliance pointer is emitted in apis.yml. The certifications are real
    claims Waystar makes, but it makes them behind a login, and the
    compliance_published check asserts that the provider PUBLISHES its compliance
    posture. Emitting the pointer would credit a gated page as a public one.
